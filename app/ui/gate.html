<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Teach me, Agent</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161b;
        --surface: #1c1f26;
        --surface-2: #232731;
        --line: #2b2f39;
        --text: #e9ebf0;
        --muted: #8d93a1;
        --accent: #ff3d7f;
      }
      body {
        margin: 0; min-height: 100vh; box-sizing: border-box; padding: 16px;
        background: var(--bg); color: var(--text);
        font: 14px/1.5 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
        border: 1px solid var(--line);
      }
      h1 { margin: 0 0 8px; font: 600 20px/1.3 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif; }
      p { margin: 0 0 8px; color: var(--muted); }
      .sid { font-family: ui-monospace, monospace; color: var(--text); }
      .list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
      .card {
        text-align: left; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
        color: inherit; padding: 10px 12px; cursor: pointer; font: inherit;
      }
      .card.on { border-color: var(--accent); background: var(--surface-2); }
      .card:disabled { opacity: 0.45; cursor: default; }
      .row { display: flex; gap: 8px; justify-content: flex-end; }
      button { border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: inherit; padding: 6px 12px; font: inherit; cursor: pointer; }
      #allow, #use { background: var(--accent); border-color: transparent; color: #fff; }
    </style>
  </head>
  <body>
    <section id="consent" hidden>
      <h1 id="title">允许连接？</h1>
      <p id="copy"></p>
      <p class="sid" id="sid"></p>
      <p id="count"></p>
      <div class="row">
        <button id="deny" type="button">拒绝</button>
        <button id="allow" type="button">允许</button>
      </div>
    </section>
    <section id="displays" hidden>
      <h1 id="display-title">在哪块屏幕上教学</h1>
      <p>截不到、或没有缩放信息的屏幕不能选。</p>
      <div id="list" class="list"></div>
      <div class="row">
        <button id="end" type="button" hidden>结束教学</button>
        <button id="cancel" type="button">取消</button>
        <button id="use" type="button">就这块</button>
      </div>
    </section>
    <script src="gate.js"></script>
  </body>
</html>
