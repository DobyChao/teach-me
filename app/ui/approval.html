<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>截屏</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161b;
        --surface: #1c1f26;
        --surface-2: #232731;
        --line: #2b2f39;
        --text: #e9ebf0;
        --accent: #ff3d7f;
      }
      body {
        margin: 0; height: 100vh; box-sizing: border-box; padding: 12px 14px;
        background: var(--bg); color: var(--text);
        font: 14px/1.5 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
        border: 1px solid var(--line); border-radius: 14px;
      }
      p { margin: 0 0 8px; }
      .bar { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-bottom: 8px; }
      .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
      .row { display: flex; gap: 8px; justify-content: flex-end; }
      button { border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: inherit; padding: 4px 10px; font: inherit; cursor: pointer; }
      #allow { background: var(--accent); border-color: transparent; color: #fff; }
    </style>
  </head>
  <body>
    <p id="text">agent 想看一眼屏幕</p>
    <div class="bar" id="bar" hidden><i id="fill"></i></div>
    <div class="row">
      <button id="deny" type="button">拒绝</button>
      <button id="interrupt" type="button" hidden>打断</button>
      <button id="allow" type="button">允许</button>
    </div>
    <script src="approval.js"></script>
  </body>
</html>
