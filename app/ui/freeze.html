<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <link rel="stylesheet" href="freeze.css" />
  </head>
  <body class="select">
    <canvas id="base"></canvas>
    <canvas id="halo"></canvas>
    <canvas id="ink"></canvas>
    <div id="veil"></div>
    <div id="sel"><span id="dim"></span></div>
    <div id="hint"></div>
    <div id="bar">
      <button id="undo" class="icon" title="撤销一笔 (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
      </button>
      <button id="reselect" class="icon" title="重新框选">
        <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" /></svg>
      </button>
      <input id="text" type="text" placeholder="想问什么？可以不写，Enter 发送" />
      <button id="mic" class="icon" title="语音输入（Win+H）">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
      </button>
      <button id="cancel" class="text-btn" title="取消 (Esc)">取消</button>
      <button id="send" class="primary" title="发送 (Enter)">交给它</button>
    </div>
    <script src="freeze.js"></script>
  </body>
</html>
