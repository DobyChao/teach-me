<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Teach me, Agent</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="mode-capsule collapsed">
    <header id="header">
      <div id="pet" class="pet" title="桌宠">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <ellipse class="shadow" cx="40" cy="70" rx="18" ry="4" />
          <circle class="ear" cx="24" cy="28" r="8" />
          <circle class="ear" cx="56" cy="28" r="8" />
          <ellipse class="body" cx="40" cy="46" rx="26" ry="22" />
          <circle class="eye" cx="32" cy="44" r="3.2" />
          <circle class="eye" cx="50" cy="44" r="3.2" />
          <path class="mouth" d="M36 52 q4 5 8 0" />
          <path class="stick" d="M60 54 l14 12" />
        </svg>
      </div>
      <div id="say-wrap">
        <span id="dot" class="dot offline"></span>
        <p id="last">还没有开始。按住说话，点一下打字。</p>
      </div>
      <div class="actions">
        <button id="btn-continue" type="button">继续</button>
        <button id="entry" type="button">按住说话</button>
        <button id="btn-board" type="button">画板</button>
        <button id="btn-eye" type="button">指引</button>
        <button id="btn-expand" type="button" title="展开">展开</button>
      </div>
    </header>

    <div id="flash" hidden>
      <p id="flash-text"></p>
      <button id="flash-undo" type="button">撤回</button>
    </div>

    <div id="tourbar" hidden>
      <span id="tour-label">引导</span>
      <button id="tour-next" type="button">下一步</button>
      <button id="tour-skip" type="button">跳过</button>
    </div>

    <div id="status"><span id="status-text">还没有教学</span></div>

    <main id="log">
      <section id="empty">
        <h2>不用切走，直接说</h2>
        <p>按住入口说话，点一下打字。画板平时点得穿。指引可以单独藏起来。</p>
      </section>
    </main>

    <footer id="foot">
      <label class="check"><input id="attach-board" type="checkbox" /> 附画板</label>
      <button id="btn-clear-user" type="button">清笔迹</button>
      <button id="btn-clear-agent" type="button">清指引</button>
      <button id="btn-settings" type="button">设置</button>
      <button id="btn-end" type="button">结束</button>
      <span class="grow"></span>
      <span id="sid"></span>
      <button id="btn-copy-id" type="button">复制</button>
    </footer>
    <script src="panel.js"></script>
  </body>
</html>
