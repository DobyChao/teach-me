<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>写一句</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; box-sizing: border-box; padding: 12px;
        display: flex; flex-direction: column; gap: 8px;
        background: #16130f; color: #f6f0e6;
        font: 14px/1.4 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
        border: 1px solid #3a3126; border-radius: 16px;
      }
      textarea {
        flex: 1; resize: none; border-radius: 10px; border: 1px solid #3a3126;
        background: #221c16; color: inherit; padding: 8px 10px;
        font: 16px/1.4 Palatino, 'Songti SC', serif;
      }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #b3a28d; font-size: 12px; }
      button { border: 0; border-radius: 999px; padding: 6px 12px; background: #ff3d7f; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <textarea id="text" placeholder="写一句，回车发送"></textarea>
    <div class="row">
      <label><input id="board" type="checkbox" /> 附画板</label>
      <span id="hint">截图已经在打开之前留下</span>
      <button id="send" type="button">发送</button>
    </div>
    <script src="input.js"></script>
  </body>
</html>
