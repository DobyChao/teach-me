<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>写一句</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161b;
        --surface: #1c1f26;
        --surface-2: #232731;
        --line: #2b2f39;
        --text: #e9ebf0;
        --muted: #8d93a1;
        --accent: #ff3d7f;
      }
      body {
        margin: 0; height: 100vh; box-sizing: border-box; padding: 12px;
        display: flex; flex-direction: column; gap: 8px;
        background: var(--bg); color: var(--text);
        font: 14px/1.5 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
        border: 1px solid var(--line); border-radius: 16px;
      }
      textarea {
        flex: 1; resize: none; border-radius: 10px; border: 1px solid var(--line);
        background: var(--surface); color: inherit; padding: 8px 10px;
        font: 16px/1.5 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
      }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
      button { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <textarea id="text" placeholder="写一句，回车发送"></textarea>
    <div class="row">
      <label><input id="board" type="checkbox" /> 附画板</label>
      <span id="hint">截图已经在打开之前留下</span>
      <button id="send" type="button">发送</button>
    </div>
    <script src="input.js"></script>
  </body>
</html>
